[package]
name = "sbt-desk-tool"
default-run = "sbt-desk-tool"
version = "1.26.8-11.67"
description = "SbtDeskTool - Desktop productivity tools"
authors = ["SabiTechHolding"]
license = ""
repository = "https://github.com/SabiTechHolding/SbtDeskTool"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
reqwest = { version = "0.12", features = ["json", "socks"] }
tokio = { version = "1", features = ["full"] }
url = "2"
window-vibrancy = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.32", features = ["bundled"] }
umya-spreadsheet = "3.0.1"
csv = "1.3"
encoding_rs = "0.8"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "zip"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Networking_WinInet", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "zip"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["linux-native-sync-persistent", "crypto-rust"] }
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "zip"] }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.4.3"
